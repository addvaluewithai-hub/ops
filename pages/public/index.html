<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLOP</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #b9b9b9;
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { height: 100%; display: grid; place-items: center; text-align: center; padding: 0 16px; }
  h1 { color: #e22; letter-spacing: .5em; font-size: 14px; margin: 0 0 24px; }
  form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  input, button { background: #111; color: #ddd; border: 1px solid #333; padding: 10px 14px;
    font: inherit; border-radius: 0; }
  button { cursor: pointer; }
  button:hover, input:focus { border-color: #e22; outline: none; }
  small { display: block; margin-top: 16px; color: #555; }
</style>
</head>
<body>
<main>
  <div>
    <h1>S.L.O.P.</h1>
    <p id="say">Waking him up…</p>
    <form id="form" hidden>
      <input id="key" type="password" placeholder="SLOP_TOKEN" autocomplete="current-password" required>
      <button>Enter</button>
    </form>
    <small>Spec-Less Output Prevention</small>
  </div>
</main>
<script>
  // Finds where the bridge is today and goes there with the key. The key is kept in this
  // browser only (localStorage), so next time it is one click.
  const say = (text) => (document.getElementById('say').textContent = text);
  const form = document.getElementById('form');
  const stored = () => { try { return localStorage.getItem('slop-key') || ''; } catch { return ''; } };
  async function go(key) {
    const { url } = await fetch('/api/bridge', { cache: 'no-store' }).then((r) => r.json());
    if (!url) return say('He is asleep. Start the bridge on the server.');
    location.href = `${url}/?key=${encodeURIComponent(key)}`;
  }
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const key = document.getElementById('key').value.trim();
    try { localStorage.setItem('slop-key', key); } catch {}
    go(key);
  });
  const key = new URLSearchParams(location.search).has('forget') ? '' : stored();
  if (key) go(key).catch(() => say('Could not reach him.'));
  else { say('Who are you?'); form.hidden = false; }
</script>
</body>
</html>
